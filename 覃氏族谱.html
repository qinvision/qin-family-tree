<!DOCTYPE html>
<html lang="zh-CN" data-theme="zhusha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>覃氏家族族谱</title>
<style>
/* ============ 主题变量 ============ */
[data-theme="zhusha"]{
  --bg:#f6f2ea; --panel:#fffdf8; --ink:#2f2a24; --muted:#8a7f70;
  --line:#cbbfa9; --accent:#8c1c13; --accent2:#b8352a;
  --male:#2f5d8a; --female:#a34a72; --gold:#b08d57;
  --header-bg:linear-gradient(135deg,#6f130d,#9c2a1e 60%,#8c1c13);
  --header-ink:#f7e8d0; --header-accent:#e8c98a;
  --chip-bg:#f0e9dc; --chip-ink:#a89474;
  --card-alt:#fbf6ec; --soft:#f5efe4;
  --input-bg:#ffffff; --input-border:#ddd2c0;
  --gen-bg1:#fdf7e9; --gen-bg2:#f1e3c6; --gen-border:#dccba7; --gen-ink:#9a7b45;
  --shadow:rgba(90,70,40,.1); --shadow-lg:rgba(90,70,40,.22);
}
[data-theme="qingci"]{
  --bg:#eef4f2; --panel:#fbfdfc; --ink:#22403a; --muted:#7c948f;
  --line:#b9d0c9; --accent:#1f6f5f; --accent2:#2e8b78;
  --male:#2a6b8a; --female:#8f5a76; --gold:#7fa093;
  --header-bg:linear-gradient(135deg,#134438,#1f6f5f 60%,#2e8b78);
  --header-ink:#e6f3ef; --header-accent:#b8e0d2;
  --chip-bg:#e3efec; --chip-ink:#7c948f;
  --card-alt:#f2f8f6; --soft:#e8f1ee;
  --input-bg:#ffffff; --input-border:#c6d8d3;
  --gen-bg1:#eef7f4; --gen-bg2:#dbece7; --gen-border:#c2d8d2; --gen-ink:#4d7f72;
  --shadow:rgba(40,90,80,.1); --shadow-lg:rgba(40,90,80,.22);
}
[data-theme="zhuqing"]{
  --bg:#f1f4ea; --panel:#fbfcf7; --ink:#2c3a24; --muted:#7d8a6f;
  --line:#c5cfb4; --accent:#4a6b32; --accent2:#648b45;
  --male:#3f6b5a; --female:#9a5f6f; --gold:#a3a86a;
  --header-bg:linear-gradient(135deg,#2e4520,#4a6b32 60%,#648b45);
  --header-ink:#eef5e2; --header-accent:#cfe0a8;
  --chip-bg:#e9eddc; --chip-ink:#7d8a6f;
  --card-alt:#f5f8ec; --soft:#eef2e2;
  --input-bg:#ffffff; --input-border:#d3dcc4;
  --gen-bg1:#f6f9ec; --gen-bg2:#e6edcf; --gen-border:#cdd9b2; --gen-ink:#6b7a4e;
  --shadow:rgba(70,90,40,.1); --shadow-lg:rgba(70,90,40,.22);
}
[data-theme="dianlan"]{
  --bg:#eef1f7; --panel:#fbfcff; --ink:#202a3c; --muted:#74809a;
  --line:#c0c9dc; --accent:#2a3f8c; --accent2:#3f5cb8;
  --male:#2f5d8a; --female:#8a4a72; --gold:#7d8bb8;
  --header-bg:linear-gradient(135deg,#1a2760,#2a3f8c 60%,#3f5cb8);
  --header-ink:#e6ebfa; --header-accent:#b9c6f0;
  --chip-bg:#e6eaf5; --chip-ink:#74809a;
  --card-alt:#f4f6fc; --soft:#eaedf6;
  --input-bg:#ffffff; --input-border:#ccd4e6;
  --gen-bg1:#f2f5fd; --gen-bg2:#e0e6f5; --gen-border:#c6d0e8; --gen-ink:#5a6a9c;
  --shadow:rgba(50,60,120,.1); --shadow-lg:rgba(50,60,120,.22);
}
[data-theme="moyu"]{
  --bg:#1c1e20; --panel:#26292c; --ink:#e8e4dc; --muted:#9a948a;
  --line:#454a4f; --accent:#c9a227; --accent2:#e0b84a;
  --male:#7fa8c9; --female:#d08aa8; --gold:#c9a227;
  --header-bg:linear-gradient(135deg,#141618,#2a2d31 60%,#3a3e44);
  --header-ink:#e8e4dc; --header-accent:#e0b84a;
  --chip-bg:#34383c; --chip-ink:#b6ad9e;
  --card-alt:#2e3236; --soft:#33373b;
  --input-bg:#2b2f33; --input-border:#4a4f55;
  --gen-bg1:#2f3337; --gen-bg2:#3a3f44; --gen-border:#565c63; --gen-ink:#c9a227;
  --shadow:rgba(0,0,0,.4); --shadow-lg:rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun","PingFang SC","Microsoft YaHei",serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
/* ============ 顶栏 ============ */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  background:var(--header-bg); color:var(--header-ink); padding:10px 18px;
  box-shadow:0 2px 14px rgba(0,0,0,.22); z-index:20; position:relative;
}
h1{font-size:17px;letter-spacing:4px;font-weight:600;white-space:nowrap;}
h1 span{color:var(--header-accent);}
.hbtn{
  font-family:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);color:var(--header-ink);padding:6px 11px;
  border-radius:6px;font-size:13px;transition:.18s;white-space:nowrap;
}
.hbtn:hover{background:rgba(255,255,255,.24);}
.hbtn.primary{background:var(--gold);color:#2a1a06;border-color:var(--gold);font-weight:700;}
.hbtn.on{background:rgba(224,176,96,.34);border-color:rgba(255,255,255,.6);}
.hbtn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none;}
.clock{font-size:12px;color:var(--header-ink);opacity:.85;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.08);}
.theme-wrap{position:relative;}
.theme-panel{
  position:absolute;top:calc(100% + 8px);left:0;width:238px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;
  box-shadow:0 14px 36px rgba(0,0,0,.28);z-index:150;
}
.theme-panel[hidden]{display:none;}
.theme-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap;}
.theme-item:hover{background:var(--soft);}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;}
.search-box{position:relative;margin-left:auto;}
.search-box input{
  font-family:inherit;font-size:13px;padding:7px 12px;width:230px;
  border:1px solid rgba(255,255,255,.3);border-radius:6px;
  background:rgba(255,255,255,.12);color:var(--header-ink);outline:none;
}
.search-box input::placeholder{color:rgba(255,255,255,.6);}
.suggestions{
  position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:230px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 14px 36px rgba(0,0,0,.28);z-index:150;max-height:300px;overflow:auto;
}
.suggestions[hidden]{display:none;}
.sug{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
.sug:hover{background:var(--soft);color:var(--accent);}
.sug small{color:var(--muted);margin-left:6px;font-size:11px;}

/* ============ 画布 ============ */
main{
  flex:1; overflow:auto; position:relative; cursor:grab;
  background:
    radial-gradient(circle at 85% 85%,rgba(140,28,19,.045),transparent 55%),
    var(--bg);
  scrollbar-width:none;
}
main::-webkit-scrollbar{width:0;height:0;}
body.dragging{cursor:grabbing;user-select:none;}
body.dragging main *{cursor:grabbing !important;}

#canvas{
  position:relative; transform-origin:0 0;
}

/* ============ 世代条（固定悬浮，永远可见） ============ */
#genLayer{
  position:fixed; inset:0; pointer-events:none; z-index:25;
}
.gen-bar{
  position:absolute; width:30px; border-radius:15px;
  background:linear-gradient(180deg,var(--gen-bg1),var(--gen-bg2));
  border:1px solid var(--gen-border);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-shadow:0 2px 10px var(--shadow);
}
.gen-bar span{
  writing-mode:vertical-rl; text-orientation:upright;
  font-size:12px; letter-spacing:4px; color:var(--gen-ink); font-weight:700;
}

/* SVG 连线层 */
#wireLayer{position:absolute; left:0; top:0; overflow:visible; z-index:1; pointer-events:none;}
#wireLayer line{stroke:var(--line); stroke-width:2;}
#wireLayer .spouse-wire{stroke:var(--gold); stroke-width:2; opacity:.85;}

/* ============ 卡片 ============ */
.card{
  position:absolute; width:130px; min-height:92px;
  background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--male);
  border-radius:9px; padding:8px 10px; text-align:center;
  box-shadow:0 3px 10px var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  cursor:pointer; user-select:none;
  transition:box-shadow .2s, transform .2s;
  z-index:2;
}
.card.female{border-top-color:var(--female);}
.card.spouse-card{background:var(--card-alt);border-top-color:var(--gold);}
.card:hover{box-shadow:0 10px 24px var(--shadow-lg); transform:translateY(-3px); z-index:10;}
.card.highlight{animation:flash 1.6s ease;}
@keyframes flash{
  0%,100%{box-shadow:0 3px 10px var(--shadow);}
  30%{box-shadow:0 0 0 4px rgba(224,176,96,.75),0 8px 22px rgba(0,0,0,.2);}
}
.cname{font-size:15px;font-weight:700;letter-spacing:1.5px;line-height:1.35;}
.cgen{font-size:10px;color:var(--chip-ink);background:var(--chip-bg);padding:1px 5px;border-radius:8px;margin-left:4px;}
.cname-row{display:flex;align-items:baseline;justify-content:center;}
.cinfo{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.3px;line-height:1.5;min-height:14px;}
.cops{display:flex;justify-content:center;gap:3px;margin-top:6px;opacity:.45;transition:opacity .18s;}
.card:hover .cops{opacity:1;}
.cops button{
  border:none;background:var(--soft);color:var(--muted);width:21px;height:21px;border-radius:50%;
  font-size:12px;cursor:pointer;line-height:1;padding:0;
}
.cops button:hover{background:var(--accent);color:#fff;}
body.locked .cops{display:none;}
body.locked .card:hover{transform:none;box-shadow:0 3px 10px var(--shadow);}

/* ============ 添加菜单（＋ 号选择） ============ */
.add-menu{
  position:fixed; z-index:320; min-width:142px;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 14px 36px rgba(0,0,0,.28); padding:5px;
}
.add-menu[hidden]{display:none;}
.add-menu button{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:9px 12px; border:none; background:transparent; border-radius:7px;
  font-family:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left;
}
.add-menu button:hover{background:var(--soft); color:var(--accent);}
.add-menu .am-ico{font-size:15px; line-height:1;}

/* ============ 缩放控件 ============ */
.zoom-ctrl{
  position:fixed;left:18px;bottom:18px;display:flex;align-items:center;gap:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:4px 6px;box-shadow:0 6px 18px var(--shadow);z-index:30;
}
.zoom-ctrl button{
  width:26px;height:26px;border:none;background:transparent;color:var(--muted);
  border-radius:50%;cursor:pointer;font-size:15px;line-height:1;
}
.zoom-ctrl button:hover{background:var(--soft);color:var(--accent);}
.zoom-ctrl span{font-size:11px;color:var(--muted);min-width:38px;text-align:center;}

/* ============ 悬停详情 ============ */
.member-tooltip{
  position:fixed; z-index:400; display:none;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; max-width:320px; max-height:70vh; overflow:auto;
  box-shadow:0 12px 36px rgba(0,0,0,.3);
  font-size:12.5px; line-height:1.7;
}
.tt-name{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line);}
.tt-name small{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px;}
.tt-row{display:flex;gap:6px;margin:2px 0;}
.tt-label{flex:0 0 62px;color:var(--muted);font-size:12px;}
.tt-value{flex:1;word-break:break-all;}
.tt-desc{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.tt-desc .tt-label{flex:0 0 auto;display:block;margin-bottom:3px;}
.tt-desc .tt-value{display:block;white-space:pre-wrap;font-size:12.5px;line-height:1.7;max-height:170px;overflow:auto;}

/* ============ 弹窗 ============ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(30,22,14,.55);
  display:none;align-items:center;justify-content:center;z-index:200;
  backdrop-filter:blur(3px);padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(700px,100%);
  max-height:90vh;overflow:auto;padding:24px 28px 20px;
  box-shadow:0 24px 70px rgba(0,0,0,.4);
}
.modal h2{margin:0 0 18px;font-size:17px;letter-spacing:2px;color:var(--accent);border-bottom:2px solid var(--chip-bg);padding-bottom:12px;}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px;}
.form-row{display:flex;flex-direction:column;gap:5px;min-width:0;}
.col-2{grid-column:span 2;} .col-3{grid-column:span 3;} .col-4{grid-column:span 4;}
.col-6{grid-column:span 6;} .col-8{grid-column:span 8;} .col-12{grid-column:span 12;}
.form-row label{font-size:12px;color:var(--muted);letter-spacing:.5px;}
.form-row label b{color:var(--accent);}
input,select,textarea{
  font-family:inherit;font-size:14px;padding:8px 11px;color:var(--ink);
  border:1px solid var(--input-border);border-radius:7px;background:var(--input-bg);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(184,53,42,.12);}
input[readonly]{background:var(--soft);color:var(--muted);}
textarea{resize:vertical;line-height:1.65;}
.name-group{display:flex;width:100%;}
.name-group input{flex:1;min-width:0;border-radius:0 7px 7px 0;}
.surname-btn{
  flex:0 0 40px;font-family:inherit;font-size:15px;cursor:pointer;
  border:1px solid var(--input-border);border-right:none;border-radius:7px 0 0 7px;
  background:var(--soft);color:var(--muted);letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;
}
.surname-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.date-group{display:flex;gap:6px;max-width:250px;}
.date-group input{flex:1;min-width:0;}
.unk-btn{
  flex:0 0 auto;font-family:inherit;font-size:12px;padding:0 9px;
  border:1px solid var(--input-border);background:var(--input-bg);color:var(--muted);
  border-radius:7px;cursor:pointer;white-space:nowrap;
}
.unk-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.sp-list{height:100px;overflow:auto;border:1px solid var(--input-border);border-radius:7px;padding:6px;background:var(--input-bg);}
.sp-item{display:flex;align-items:center;gap:6px;padding:3px 4px;font-size:13px;cursor:pointer;}
.sp-item:hover{background:var(--soft);}
.hint{font-size:11px;color:var(--muted);opacity:.8;margin-top:2px;}
.modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:22px;}
.modal-actions #addMemberBtn{margin-right:auto;}
.modal-actions button{
  font-family:inherit;cursor:pointer;padding:9px 22px;border-radius:8px;font-size:14px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
}
.modal-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

/* 空状态 */
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px;}
.empty-icon{width:88px;height:88px;line-height:88px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#f3d9a8;font-size:42px;font-weight:700;}
.empty h2{margin:0 0 8px;font-size:19px;color:var(--ink);letter-spacing:2px;}
.empty p{margin:0 0 22px;font-size:13.5px;line-height:1.9;}
.empty-actions button{font-family:inherit;cursor:pointer;padding:9px 20px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
.empty-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

@media (max-width:860px){
  h1{font-size:15px;letter-spacing:2px;}
  .hbtn{padding:5px 9px;font-size:12px;}
  .search-box{margin-left:0;width:100%;}
  .search-box input{width:100%;}
}
</style>
</head>
<body class="locked">

<header>
  <h1>覃氏<span>族谱</span></h1>
  <button class="hbtn primary" id="addRootBtn" disabled>＋ 添加成员</button>
  <button class="hbtn on" id="lockBtn">🔒 已锁定</button>
  <button class="hbtn" id="backupBtn">备份数据</button>
  <button class="hbtn" id="shareBtn">导出网页</button>
  <button class="hbtn" id="importBtn">导入</button>
  <div class="theme-wrap">
    <button class="hbtn" id="themeBtn">🎨 主题</button>
    <div class="theme-panel" id="themePanel" hidden></div>
  </div>
  <div class="clock" id="clock"></div>
  <div class="search-box">
    <input id="searchInput" placeholder="搜索姓名 / 籍贯 / 简介…" autocomplete="off">
    <div id="suggestions" class="suggestions" hidden></div>
  </div>
</header>

<main id="mainEl">
  <div id="canvas">
    <svg id="wireLayer"></svg>
  </div>
</main>

<!-- 世代条：脱离 canvas，固定悬浮 -->
<div id="genLayer"></div>

<!-- ＋ 号选择菜单 -->
<div class="add-menu" id="addMenu" hidden></div>

<div class="member-tooltip" id="memberTooltip"></div>

<div class="zoom-ctrl">
  <button id="zoomOut" title="缩小">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" title="放大">＋</button>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="addMemberBtn">＋ 添加成员</button>
      <button id="cancelBtn">取消</button>
      <button class="primary" id="saveBtn">保存</button>
    </div>

<script>
/* =========================================================

const STORAGE_KEY = 'qin_family_tree_v2';

const canvas      = document.getElementById('canvas');
const wireLayer   = document.getElementById('wireLayer');

let members = [];
let modalState = {};
let scale = 1;

let suppressClick = false;

/* 布局常量（逻辑像素，不受 zoom 影响） */
const CARD_W = 130;
const CARD_H = 92;
const SPOUSE_GAP = 14;
const UNIT_GAP = 50;
const ROW_H = 160;          /* 每个世代垂直间距 */
const X_OFFSET = 80;        /* 左边给世代条留空间 */
const Y_OFFSET = 40;        /* 顶部留白 */
const V_BUS = 40;           /* 父子连线垂直段 */

const RANK_OPTIONS = ['长子','次子','三子','四子','五子','六子','七子','八子','九子','十子',
                      '长女','次女','三女','四女','五女','六女','七女','八女','九女','十女'];

];

function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toCN(n){ const d=['零','一','二','三','四','五','六','七','八','九']; if(n<=10) return n===10?'十':d[n]; if(n<20) return '十'+d[n-10]; if(n<100){const t=Math.floor(n/10),r=n%10;return d[t]+'十'+(r?d[r]:'');} return String(n); }
function dateStamp(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function getMember(id){ return id ? members.find(m=>m.id===id) : null; }
function pad2(n){ return String(n).padStart(2,'0'); }

/* =========================================================
   数据加载
   ========================================================= */
function load(){
  let embData = null;
  try{
    const el = document.getElementById('embedded-data');
    if(el){ const d = JSON.parse(el.textContent || '{}'); if(d && Array.isArray(d.members)) embData = d; }
  }catch(e){}

  let localMembers = null, localVer = 0;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) localMembers = arr; }
    const v = localStorage.getItem(STORAGE_KEY + '_ver');
    if(v) localVer = parseInt(v,10)||0;
  }catch(e){}

  if(embData && embData.members && embData.members.length){
    const embVer = parseInt(embData.version,10)||0;
    if(!localMembers || localMembers.length===0 || embVer > localVer){
      members = embData.members;
      normalize(); save();
      try{ localStorage.setItem(STORAGE_KEY+'_ver', String(embVer)); }catch(e){}
      return;
    }
  }
  if(localMembers && localMembers.length){ members = localMembers; normalize(); return; }
  members = []; normalize();
}
function normalize(){
  if(!Array.isArray(members)) members = [];
  members.forEach(m=>{
    m.spouseIds = Array.isArray(m.spouseIds) ? m.spouseIds : [];
    if(!m.gender) m.gender = 'M';
    if(m.rank===undefined) m.rank='';
    if(m.relationNote===undefined) m.relationNote='';
    if(m.marriageType===undefined) m.marriageType='元配';
  });
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(members)); }
  catch(e){ alert('本地存储写入失败：'+e.message); }
}

/* =========================================================
   关系计算
   ========================================================= */
function generationOf(id, seen){
  seen = seen || new Set();
  if(seen.has(id)) return 1;
  seen.add(id);
  const m = getMember(id); if(!m) return 1;
  if(m.fatherId){ const f = getMember(m.fatherId); if(f) return generationOf(m.fatherId, seen)+1; }
  const sp = (m.spouseIds||[]).map(getMember).find(x=>x&&x.fatherId);
  if(sp) return generationOf(sp.id, seen);
  return 1;
}
function childrenOf(id){
  return members.filter(m=>m.fatherId===id || m.motherId===id);
}
function maleChildrenOf(id){
  return childrenOf(id).filter(k=>k.gender!=='F');
}
function spouseFemales(m){
  return (m.spouseIds||[]).map(sid=>getMember(sid)).filter(s=>s&&s.gender==='F');
}
function siblingRankOf(m){
  if(m.rank) return m.rank;
  const g = m.gender==='F'?'F':'M';
  const pid = m.fatherId||m.motherId;
  if(!pid) return '';
  const sibs = childrenOf(pid).filter(x=>(x.gender==='F'?'F':'M')===g);
  const idx = sibs.findIndex(x=>x.id===m.id);
  if(idx<0) return '';
  const arr = ['长','次','三','四','五','六','七','八','九','十'];
  return (idx<10?arr[idx]:toCN(idx+1)) + (g==='F'?'女':'子');
}
function childStatsOf(id){
  let s=0,d=0;
  members.forEach(x=>{ if(x.fatherId===id||x.motherId===id){ if(x.gender==='F') d++; else s++; } });
  return {s,d};
}

/* =========================================================
   布局算法：后序遍历分配 x，y 由世代决定
   ========================================================= */
function computeLayout(){
  const units = new Map();
  members.filter(m=>m.gender!=='F').forEach(m=>{
    units.set(m.id, { head:m, kids:[], x:0, width:0, y:0, spouseCount:0 });
  });
  units.forEach(u=>{
    u.kids = maleChildrenOf(u.head.id).map(k=>units.get(k.id)).filter(Boolean);
    u.spouseCount = spouseFemales(u.head).length;
    u.width = CARD_W + u.spouseCount * (CARD_W + SPOUSE_GAP);
  });

  let leafX = X_OFFSET;
  function dfs(unit){
    if(unit.kids.length===0){
      unit.x = leafX + unit.width/2;
      leafX += unit.width + UNIT_GAP;
    }else{
      unit.kids.forEach(dfs);
      unit.x = (unit.kids[0].x + unit.kids[unit.kids.length-1].x)/2;
    }
  }
  const roots = members.filter(m=>m.gender!=='F' && !m.fatherId && !m.motherId).map(m=>units.get(m.id)).filter(Boolean);
  roots.forEach(dfs);

  units.forEach(u=>{
    if(u.x===0 && u.width>0 && !u.kids.length){
      u.x = leafX + u.width/2;
      leafX += u.width + UNIT_GAP;
    }
  });

  units.forEach(u=>{ u.y = Y_OFFSET + (generationOf(u.head.id)-1) * ROW_H; });

  return { units, roots };
}

}

  units.forEach(u=>{
    const head = u.head;
    const headLeft = u.x - u.width/2;
    renderCard(head, headLeft, u.y, false);
    spouseFemales(head).forEach((sp,i)=>{
      const spLeft = headLeft + CARD_W + SPOUSE_GAP + i*(CARD_W + SPOUSE_GAP);
      renderCard(sp, spLeft, u.y, true);
    });
  });

  /* --- 渲染连线（SVG） --- */
  let maxX = 0, maxY = 0;
  units.forEach(u=>{
    const headCX = u.x;
    const headBottom = u.y + CARD_H;
    const headLeft = u.x - u.width/2;

    spouseFemales(u.head).forEach((sp,i)=>{
      const x1 = headLeft + CARD_W + i*(CARD_W + SPOUSE_GAP);
      const x2 = x1 + SPOUSE_GAP;
      const y = u.y + CARD_H/2;
      drawWire(x1, y, x2, y, 'spouse-wire');
    });

    if(u.kids.length){
      const busY = headBottom + V_BUS/2;
      drawWire(headCX, headBottom, headCX, busY);
      const firstKidCX = u.kids[0].x;
      const lastKidCX = u.kids[u.kids.length-1].x;
      drawWire(firstKidCX, busY, lastKidCX, busY);
      u.kids.forEach(kid=>{
        drawWire(kid.x, busY, kid.x, kid.y);
      });
    }
    maxX = Math.max(maxX, u.x + u.width/2 + 40);
    maxY = Math.max(maxY, u.y + CARD_H + 60);
  });

  canvas.style.width = (maxX + 80) + 'px';
  canvas.style.height = (maxY + 80) + 'px';
  wireLayer.style.width = (maxX + 80) + 'px';
  wireLayer.style.height = (maxY + 80) + 'px';

  /* --- 世代条 --- */
  renderGenBars(units);
}

function renderCard(m, left, top, isSpouse){
  const el = document.createElement('div');
  el.className = 'card' + (m.gender==='F'?' female':'') + (isSpouse?' spouse-card':'');
  el.dataset.id = m.id;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  el.style.width = CARD_W + 'px';

  const gen = generationOf(m.id);
  const rank = siblingRankOf(m);
  let info = '';
  if(m.gender==='F'){
    const st = childStatsOf(m.id);
    const parts = [];
    if(m.marriageType==='继配') parts.push('继配');
    if(st.s+st.d>0) parts.push(`生${st.s}子${st.d}女`);
    if(!parts.length && rank) parts.push(rank);
    info = parts.join(' · ');
  }else{
    info = rank;
  }

  el.innerHTML = `
    <div class="cname-row">
      <span class="cname">${esc(m.name)}</span>
      <span class="cgen">${toCN(gen)}世</span>
    </div>
    <div class="cinfo">${esc(info)}</div>
    <div class="cops">
      <button data-act="child" title="添加子女">＋</button>
      <button data-act="spouse" title="添加配偶">♥</button>
      <button data-act="print" title="打印直系成员表">🖨</button>
      <button data-act="del" title="删除">✕</button>
    </div>`;

  el.addEventListener('mouseenter', ()=>{ if(locked) showTooltip(m, el); });
  el.addEventListener('mouseleave', ()=>{ if(locked) scheduleHideTooltip(); });

  canvas.appendChild(el);
}

function drawWire(x1,y1,x2,y2, cls){
  const ns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  if(cls) line.setAttribute('class', cls);
  wireLayer.appendChild(line);
}

/* =========================================================
   世代条：固定悬浮，永远可见
   ========================================================= */
let genBarDefs = [];   /* [{g, top, bottom}] 画布坐标系 */

function renderGenBars(units){
  genLayer.innerHTML = '';
  genBarDefs = [];
  const genMap = new Map();
  units.forEach(u=>{
    const g = generationOf(u.head.id);
    const top = u.y;
    const bottom = u.y + CARD_H;
    const cur = genMap.get(g) || {top:Infinity, bottom:-Infinity};
    cur.top = Math.min(cur.top, top);
    cur.bottom = Math.max(cur.bottom, bottom);
    genMap.set(g, cur);
  });

  [...genMap.keys()].sort((a,b)=>a-b).forEach(g=>{
    const {top,bottom} = genMap.get(g);
    if(bottom-top < 4) return;
    genBarDefs.push({ g, top, bottom });
    const bar = document.createElement('div');
    bar.className = 'gen-bar';
    bar.innerHTML = `<span>${toCN(g)}世</span>`;
    genLayer.appendChild(bar);
  });

  positionGenBars();
}

function positionGenBars(){
  const bars = genLayer.children;
  if(!bars.length) return;
  const rect = mainEl.getBoundingClientRect();
  const st = mainEl.scrollTop;
  const barW = 30;
  const left = Math.max(2, rect.left + 6);

  for(let i=0;i<bars.length;i++){
    const bar = bars[i];
    const def = genBarDefs[i];
    if(!def){ bar.style.display = 'none'; continue; }

    const topY  = rect.top + def.top * scale - st;
    const fullH = (def.bottom - def.top) * scale;
    const visTop    = Math.max(rect.top + 4, topY);
    const visBottom = Math.min(rect.bottom - 4, topY + fullH);

    if(visBottom - visTop < 20){ bar.style.display = 'none'; continue; }

    bar.style.display = 'flex';
    bar.style.left   = left + 'px';
    bar.style.width  = barW + 'px';
    bar.style.top    = visTop + 'px';
    bar.style.height = (visBottom - visTop) + 'px';
  }
}

mainEl.addEventListener('scroll', positionGenBars, {passive:true});
window.addEventListener('resize', positionGenBars);

function setScale(v){
  scale = Math.min(1.8, Math.max(0.35, v));
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = '0 0';
  document.getElementById('zoomLabel').textContent = Math.round(scale*100)+'%';
  hideTooltip();
  positionGenBars();
}
document.getElementById('zoomIn').addEventListener('click', ()=>setScale(scale+0.1));
document.getElementById('zoomOut').addEventListener('click', ()=>setScale(scale-0.1));

mainEl.addEventListener('wheel', e=>{
  e.preventDefault();
  hideTooltip();
  const oldScale = scale;
  const step = e.deltaY>0 ? -0.1 : 0.1;
  const newScale = Math.min(1.8, Math.max(0.35, oldScale+step));
  if(newScale===oldScale) return;
  const rect = mainEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const cx = (mainEl.scrollLeft + mx) / oldScale;
  const cy = (mainEl.scrollTop + my) / oldScale;
  setScale(newScale);
  mainEl.scrollLeft = cx * newScale - mx;
  mainEl.scrollTop = cy * newScale - my;
  positionGenBars();
}, {passive:false});

    mainEl.scrollLeft = drag.sl - dx;
    mainEl.scrollTop = drag.st - dy;
  }

  if(!drag) return;
  const moved = drag.moved;

/* =========================================================
   打印：本人 + 配偶 + 直系长辈 + 直系后裔（旁系不打印）
   ========================================================= */
function collectPrintMembers(rootId){
  const root = getMember(rootId);
  if(!root) return [];
  const ids = new Set();
  const add = x => { if(x && x.id) ids.add(x.id); };

  /* 1. 本人及配偶 */
  add(root);
  (root.spouseIds||[]).forEach(sid=>add(getMember(sid)));

  /* 2. 直系长辈：父 / 母逐级向上，含其配偶 */
  const upStack = [root];
  const seenUp = new Set([root.id]);
  while(upStack.length){
    const cur = upStack.pop();
    [cur.fatherId, cur.motherId].forEach(pid=>{
      const p = getMember(pid);
      if(!p || seenUp.has(p.id)) return;
      seenUp.add(p.id);
      add(p);
      (p.spouseIds||[]).forEach(sid=>{
        const s = getMember(sid);
        if(s && !seenUp.has(s.id)){ seenUp.add(s.id); add(s); }
      });
      upStack.push(p);
    });
  }

  /* 3. 本人直系后裔：子 / 女逐级向下，含其配偶 */
  const downStack = [root];
  const seenDown = new Set([root.id]);
  while(downStack.length){
    const cur = downStack.pop();
    childrenOf(cur.id).forEach(k=>{
      if(seenDown.has(k.id)) return;
      seenDown.add(k.id);
      add(k);
      (k.spouseIds||[]).forEach(sid=>{
        const s = getMember(sid);
        if(s && !seenDown.has(s.id)){ seenDown.add(s.id); add(s); }
      });
      downStack.push(k);
    });
  }

  return members.filter(m=>ids.has(m.id));
}

/* 用布局坐标给成员排序，保证同代夫妻相邻、兄弟按长幼 */
function memberSortIndex(){
  const map = new Map();
  try{
    const { units } = computeLayout();
    units.forEach(u=>{
      const headLeft = u.x - u.width/2;
      map.set(u.head.id, headLeft + CARD_W/2);
      spouseFemales(u.head).forEach((sp,i)=>{
        const spLeft = headLeft + CARD_W + SPOUSE_GAP + i*(CARD_W + SPOUSE_GAP);
        map.set(sp.id, spLeft + CARD_W/2);
      });
    });
  }catch(e){}
  return map;
}

function printMember(id){

  list.sort((a,b)=>{
    const ga = generationOf(a.id), gb = generationOf(b.id);
    if(ga !== gb) return ga - gb;
    const oa = order.has(a.id) ? order.get(a.id) : Number.MAX_SAFE_INTEGER;
    const ob = order.has(b.id) ? order.get(b.id) : Number.MAX_SAFE_INTEGER;
    if(oa !== ob) return oa - ob;

  </style></head><body>
    <div class="head">

function openPrintFrame(html){
  const old = document.getElementById('printFrame');
  if(old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.id = 'printFrame';
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();

  const doPrint = ()=>{
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(err){ console.warn('打印失败：', err); }
  };

  if(iframe.contentWindow.document.readyState === 'complete'){
    setTimeout(doPrint, 260);
  }else{
    iframe.onload = ()=> setTimeout(doPrint, 260);
    setTimeout(doPrint, 500); /* 兜底 */
  }

  setTimeout(()=>{ const f = document.getElementById('printFrame'); if(f) f.remove(); }, 60000);
}

function digestTarget(){

function b64ToHex(b64){

  for(let i=0;i<bin.length;i++) h += ('0' + bin.charCodeAt(i).toString(16)).slice(-2);

const _K256 = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function rotr32(x,n){ return (x>>>n)|(x<<(32-n)); }
function sha256Hex(str){
  const utf8 = unescape(encodeURIComponent(String(str)));
  const bytes = [];
  for(let i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i));
  const len = bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64 !== 56) bytes.push(0);
  const hi = Math.floor(len/4294967296), lo = len>>>0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Array(64);
  for(let off=0; off<bytes.length; off+=64){
    for(let i=0;i<16;i++) w[i] = (bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
    for(let i=16;i<64;i++){
      const x = w[i-15], y = w[i-2];
      const s0 = rotr32(x,7)^rotr32(x,18)^(x>>>3);
      const s1 = rotr32(y,17)^rotr32(y,19)^(y>>>10);
      w[i] = (w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1 = rotr32(e,6)^rotr32(e,11)^rotr32(e,25);
      const ch = (e&f)^(~e&g);
      const t1 = (h+S1+ch+_K256[i]+w[i])|0;
      const S0 = rotr32(a,2)^rotr32(a,13)^rotr32(a,22);
      const mj = (a&b)^(a&c)^(b&c);
      const t2 = (S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  let out = '';
  for(let i=0;i<8;i++) out += ('00000000'+(H[i]>>>0).toString(16)).slice(-8);
  return out;
}

function lockToast(text){
  let t = document.getElementById('lockToast');
  if(!t){ t = document.createElement('div'); t.id = 'lockToast'; t.className = 'lock-toast'; document.body.appendChild(t); }
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2400);
}
function openUnlock(){
  ensureUnlockUI();
  const inp = document.getElementById('unlockPwd');
  inp.value = '';
  document.getElementById('unlockMsg').textContent = '';
  unlockEl.classList.add('show');
  setTimeout(()=>inp.focus(), 60);
}
function closeUnlock(){ if(unlockEl) unlockEl.classList.remove('show'); }
function tryUnlock(){
  const inp  = document.getElementById('unlockPwd');
  const msg  = document.getElementById('unlockMsg');
  const card = document.getElementById('unlockCard');
  const val  = inp.value;
  if(!val){ msg.textContent = '请输入解锁密码'; return; }
  if(sha256Hex(val) === b64ToHex(digestTarget())){
    locked = false;
    applyLock();
    closeUnlock();
    lockToast('已解锁，可编辑、备份与导出');
  }else{
    msg.textContent = '密码错误，请重新输入';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inp.value = ''; inp.focus();
  }
}

/* ---------- 1–18 世强制逝世 ---------- */
function enforceDeceasedRule(){
  let changed = false;
  members.forEach(m=>{
    const g = generationOf(m.id);
    if(g >= 1 && g <= MAX_DECEASED_GEN && !String(m.death||'').trim()){
      m.death = '失考';
      changed = true;
    }
  });
  if(changed) save();
  return changed;
}

const lockBtn = document.getElementById('lockBtn');
const addRootBtn = document.getElementById('addRootBtn');
function applyLock(){
  document.body.classList.toggle('locked', locked);
  lockBtn.innerHTML = locked ? '🔒 已锁定' : '🔓 可编辑';
  lockBtn.classList.toggle('on', locked);
  addRootBtn.disabled = locked;
  ['backupBtn','shareBtn','importBtn'].forEach(id=>{
    const b = document.getElementById(id);
    if(b){ b.disabled = locked; b.title = locked ? '请先解锁' : ''; }
  });
  hideTooltip();
  if(locked) hideAddMenu();
}

  locked = true;

});

const memberTooltip = document.getElementById('memberTooltip');
let tooltipHideTimer = null;
function cancelHideTooltip(){ if(tooltipHideTimer){ clearTimeout(tooltipHideTimer); tooltipHideTimer=null; } }
function scheduleHideTooltip(){ if(tooltipHideTimer) clearTimeout(tooltipHideTimer); tooltipHideTimer = setTimeout(hideTooltip, 360); }

function showTooltip(m, cardEl){
  if(!locked) return;
  cancelHideTooltip();
  const deceased = !!(m.death||'').trim();
  const gen = generationOf(m.id);
  const birth = (m.birth||'').trim()||'不详';
  const death = (m.death||'').trim();
  const lifeText = deceased ? `${birth} — ${death}` : `${birth} — 在世`;
  const rankText = siblingRankOf(m) || '—';
  const spouseText = (m.spouseIds||[]).map(sid=>{const s=getMember(sid);return s?s.name:'';}).filter(Boolean).join('、') || '—';

  memberTooltip.innerHTML = `
    <div class="tt-name">${esc(m.name)}<small>${m.gender==='F'?'女':'男'} · ${toCN(gen)}世</small></div>
    <div class="tt-row"><span class="tt-label">配偶</span><span class="tt-value">${esc(spouseText)}</span></div>
    <div class="tt-row"><span class="tt-label">生卒</span><span class="tt-value">${esc(lifeText)}</span></div>
    <div class="tt-row"><span class="tt-label">排行</span><span class="tt-value">${esc(rankText)}</span></div>
    <div class="tt-row"><span class="tt-label">职业</span><span class="tt-value">${esc(m.occupation||'—')}</span></div>
    <div class="tt-desc"><span class="tt-label">${deceased?'人物生平':'人物简介'}</span><span class="tt-value">${m.notes?esc(m.notes):'暂无记载'}</span></div>`;
  memberTooltip.style.display = 'block';
  const rect = cardEl.getBoundingClientRect();
  const tw = memberTooltip.offsetWidth, th = memberTooltip.offsetHeight;
  let left = rect.right + 4, top = rect.top + rect.height/2 - th/2;
  if(left+tw > window.innerWidth-8) left = rect.left - tw - 4;
  if(left<8) left = 8;
  if(top<8) top = 8;
  if(top+th > window.innerHeight-8) top = window.innerHeight - th - 8;
  memberTooltip.style.left = left+'px';
  memberTooltip.style.top = top+'px';
}
function hideTooltip(){ cancelHideTooltip(); memberTooltip.style.display='none'; memberTooltip.innerHTML=''; }
memberTooltip.addEventListener('mouseenter', cancelHideTooltip);
memberTooltip.addEventListener('mouseleave', scheduleHideTooltip);

      const sp = getMember(modalState.spouseId);

      const arr = ['长','次','三','四','五','六','七','八','九','十'];

          <input id="f_name" value="${esc(shownName)}" placeholder="名（如 永泰）" autocomplete="off">
        </div></div>
      <div class="form-row col-2"><label>性别</label>
        <select id="f_gender">
          <option value="M" ${m.gender!=='F'?'selected':''}>男</option>
          <option value="F" ${m.gender==='F'?'selected':''}>女</option>

      <div class="form-row col-2"><label>排行</label><select id="f_rank">${rankOptions}</select></div>

        <div class="date-group">
          <input id="f_birth" value="${esc(m.birth||'')}" ${isBirthUnknown?'readonly':''} placeholder="如 1950 或 1950-03-05">

        </div></div>
      <div class="form-row col-6"><label>逝世</label>

          <button type="button" class="unk-btn ${(isDeathUnknown||deathLocked)?'active':''}" data-target="f_death" ${deathLocked?'disabled':''}>失考</button>
        </div>
        ${deathLocked ? '<div class="gen-lock-hint">第 ' + targetGen + ' 世属 1–18 世范围，固定为逝世状态，此栏不可留空、不可改为在世。</div>' : ''}
      </div>

      <div class="form-row col-6"><label>父亲</label><select id="f_father">${parentOptions(m.fatherId||'')}</select></div>
      <div class="form-row col-6"><label>母亲</label><select id="f_mother">${parentOptions(m.motherId||'')}</select></div>

      <div class="form-row col-12"><label>配偶（点击勾选，可多选）</label>
        <div id="f_spouses" class="sp-list">${spouseList}</div>
        <div class="hint">若配偶尚未录入，可先保存本成员，再点其卡片上的 ♥ 添加配偶。</div></div>

      <div class="form-row col-4"><label>字辈</label><input id="f_gen" value="${esc(m.genName||'')}" placeholder="如 德字辈"></div>
      <div class="form-row col-4"><label>籍贯</label><input id="f_birthplace" value="${esc(m.birthplace||'')}" placeholder="如 广西桂平"></div>
      <div class="form-row col-4"><label id="residenceLabel">${residenceLabel}</label><input id="f_residence" value="${esc(m.residence||'')}" placeholder="${deceased?'安葬地':'现居 / 安葬地'}"></div>

      <div class="form-row col-6"><label>职业 / 职务</label><input id="f_occupation" value="${esc(m.occupation||'')}" placeholder="如 教师、务农"></div>

  document.getElementById('surnameBtn').addEventListener('click', function(){ this.classList.toggle('active'); });

function descendantsOf(id){
  const set = new Set(); const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    members.forEach(m=>{
      if((m.fatherId===cur||m.motherId===cur) && !set.has(m.id)){ set.add(m.id); stack.push(m.id); }
    });
  }
  return [...set];
}

function submitForm(){
  const surnameOn = document.getElementById('surnameBtn').classList.contains('active');
  let namePart = document.getElementById('f_name').value.trim();
  if(!namePart){ alert('请填写名字'); document.getElementById('f_name').focus(); return null; }
  if(surnameOn && namePart.startsWith('覃')) namePart = namePart.slice(1);
  const fullName = (surnameOn?'覃':'') + namePart;

  const spouses = Array.from(document.querySelectorAll('#f_spouses input[name="f_spouse"]:checked')).map(o=>o.value).filter(Boolean);
  const data = {
    name: fullName,
    gender: document.getElementById('f_gender').value,
    marriageType: document.getElementById('f_marriage').value || '元配',
    birth: document.getElementById('f_birth').value.trim(),
    death: document.getElementById('f_death').value.trim(),
    fatherId: document.getElementById('f_father').value || null,
    motherId: document.getElementById('f_mother').value || null,
    spouseIds: spouses,
    genName: document.getElementById('f_gen').value.trim(),
    rank: document.getElementById('f_rank').value || '',
    birthplace: document.getElementById('f_birthplace').value.trim(),
    residence: document.getElementById('f_residence').value.trim(),
    occupation: document.getElementById('f_occupation').value.trim(),
    relationNote: document.getElementById('f_relationNote').value || '',
    notes: document.getElementById('f_notes').value.trim()
  };

  let target;
  if(modalState.editId){
    target = getMember(modalState.editId);
    if(!target){ closeModal(); return null; }
    (target.spouseIds||[]).forEach(sid=>{
      const s = getMember(sid);
      if(s && s.spouseIds) s.spouseIds = s.spouseIds.filter(x=>x!==target.id);
    });
    Object.assign(target, data);
  }else{
    data.id = uid();
    members.push(data);
    target = data;
  }

  /* 双向同步配偶 */
  target.spouseIds.forEach(sid=>{
    const s = getMember(sid);
    if(s){ s.spouseIds = s.spouseIds||[]; if(!s.spouseIds.includes(target.id)) s.spouseIds.push(target.id); }
  });
  target.spouseIds = target.spouseIds.filter(sid=>!!getMember(sid));

  /* 1–18 世一律逝世：留空即补「失考」 */
  const gTarget = generationOf(target.id);
  if(gTarget >= 1 && gTarget <= MAX_DECEASED_GEN && !String(target.death||'').trim()){
    target.death = '失考';
  }

  save(); closeModal();
  render();
  return target;
}

function deleteMember(id){
  const m = getMember(id); if(!m) return;
  const kids = members.filter(x=>x.fatherId===id||x.motherId===id);
  const msg = kids.length
    ? `「${m.name}」名下有 ${kids.length} 位子嗣。\n删除后，这些子嗣将成为无父辈的独立分支。\n\n确定要删除吗？`
    : `确定要删除「${m.name}」吗？此操作不可撤销。`;
  if(!confirm(msg)) return;
  members = members.filter(x=>x.id!==id);
  members.forEach(x=>{
    if(x.fatherId===id) x.fatherId=null;
    if(x.motherId===id) x.motherId=null;
    x.spouseIds = (x.spouseIds||[]).filter(s=>s!==id);
  });
  save(); render();
}

const searchInput = document.getElementById('searchInput');
const sugBox = document.getElementById('suggestions');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  if(!q){ sugBox.hidden=true; sugBox.innerHTML=''; return; }
  const res = members.filter(m=>{
    const hay = [m.name,m.birthplace,m.residence,m.occupation,m.notes,m.genName,m.rank,m.birth,m.death].filter(Boolean).join(' ');
    return hay.includes(q);
  }).slice(0,20);
  if(!res.length){ sugBox.innerHTML=`<div class="sug" style="cursor:default;color:var(--muted)">未找到「${esc(q)}」</div>`; sugBox.hidden=false; return; }
  sugBox.innerHTML = res.map(m=>{
    const extra = [m.gender==='F'?'女':'男', generationOf(m.id)+'世', m.rank, m.birthplace].filter(Boolean).join(' · ');
    return `<div class="sug" data-id="${m.id}">${esc(m.name)}<small>${esc(extra)}</small></div>`;
  }).join('');
  sugBox.hidden = false;
});
sugBox.addEventListener('click', e=>{
  const item = e.target.closest('.sug[data-id]');
  if(!item) return;
  const id = item.dataset.id;
  sugBox.hidden = true; searchInput.value = '';
  focusMember(id);
});

});

/* =========================================================
   备份 / 导出 / 导入
   ========================================================= */
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1200);
}

  const payload = { app:'覃氏家族族谱', version:7, exportedAt:new Date().toISOString(), members };
  downloadFile(JSON.stringify(payload, null, 2), `覃氏族谱_${dateStamp()}.json`, 'application/json');
});

/* ---------- 导出网页：内嵌全部最新数据 ---------- */
function buildExportHTML(){
  save();
  const stamp = Date.now();
  const clone = document.documentElement.cloneNode(true);

  /* 1. 清理运行期生成的内容 */
  const canvasEl = clone.querySelector('#canvas');
  if(canvasEl){
    canvasEl.innerHTML = '<svg id="wireLayer"></svg>';
    canvasEl.removeAttribute('style');
    canvasEl.removeAttribute('hidden');
  }
  const genEl = clone.querySelector('#genLayer');
  if(genEl){ genEl.innerHTML = ''; genEl.removeAttribute('style'); genEl.removeAttribute('hidden'); }

  const tooltipEl = clone.querySelector('#memberTooltip');
  if(tooltipEl){ tooltipEl.innerHTML = ''; tooltipEl.removeAttribute('style'); }

  const sugEl = clone.querySelector('#suggestions');
  if(sugEl){ sugEl.innerHTML = ''; sugEl.setAttribute('hidden',''); }

  const themeP = clone.querySelector('#themePanel');
  if(themeP){ themeP.innerHTML = ''; themeP.setAttribute('hidden',''); }

  const menuEl = clone.querySelector('#addMenu');
  if(menuEl){ menuEl.innerHTML = ''; menuEl.setAttribute('hidden',''); menuEl.removeAttribute('style'); }

  const modalBodyEl = clone.querySelector('#modalBody');
  if(modalBodyEl){ modalBodyEl.innerHTML = ''; }

  const backdropEl = clone.querySelector('#modalBackdrop');
  if(backdropEl){ backdropEl.classList.remove('show'); }

  /* 移除运行期 iframe（打印用） */
  clone.querySelectorAll('iframe').forEach(f=>f.remove());

  const clockEl2 = clone.querySelector('#clock');
  if(clockEl2) clockEl2.textContent = '';

  const searchEl = clone.querySelector('#searchInput');
  if(searchEl){ searchEl.removeAttribute('value'); searchEl.removeAttribute('style'); }

  const zoomLabelEl = clone.querySelector('#zoomLabel');
  if(zoomLabelEl) zoomLabelEl.textContent = '100%';

  const bodyEl = clone.querySelector('body');
  if(bodyEl) bodyEl.className = 'locked';

  /* 2. 内嵌最新数据（包含所有在线编辑） */
  const de = clone.querySelector('#embedded-data');
  if(de){
    de.textContent = JSON.stringify({
      version: stamp,
      exportedAt: new Date().toISOString(),
      members: members
    }).replace(/</g, '\\u003c');
  }

  /* 3. 存储 key 唯一化，避免读取访客浏览器里的旧数据 */
  clone.querySelectorAll('script:not([type="application/json"])').forEach(s=>{
    s.textContent = s.textContent.replace(
      /const STORAGE_KEY\s*=\s*'[^']*';/,
      `const STORAGE_KEY = 'qin_family_tree_${stamp}';`
    );
  });

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

  if(!members.length){ alert('当前没有可导出的数据。'); return; }
  const html = buildExportHTML();

  setTimeout(()=>alert('导出成功！\n已包含全部最新数据（共 ' + members.length + ' 位成员）。\n接收者打开即可直接查看。'), 400);

document.getElementById('importBtn').addEventListener('click', ()=>{
  if(locked){ lockToast('族谱处于锁定状态，请先解锁后再导入'); return; }
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      let list = Array.isArray(data) ? data : (data && Array.isArray(data.members) ? data.members : null);
      if(!list) throw new Error('格式不正确');
      list.forEach(m=>{
        if(!m.id) m.id = uid();
        m.spouseIds = Array.isArray(m.spouseIds)?m.spouseIds:[];
        if(!m.gender) m.gender='M';
        if(m.rank===undefined) m.rank='';
        if(m.marriageType===undefined) m.marriageType='元配';
      });
      const mode = members.length===0 ? 'replace' : (confirm('确定=覆盖现有族谱\n取消=合并到现有族谱')?'replace':'merge');
      if(mode==='replace') members = list;
      else{
        const existIds = new Set(members.map(m=>m.id));
        list.forEach(m=>{ if(existIds.has(m.id)) m.id=uid(); members.push(m); });
      }
      enforceDeceasedRule();
      save(); render();
      alert(`导入成功，共 ${list.length} 位成员。\n（第 1–18 世已按规则固定为逝世）`);
    }catch(err){ alert('导入失败：'+err.message); }
    e.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
});
